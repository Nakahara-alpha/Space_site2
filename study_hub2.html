<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Study Hub" />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="theme-color"
      content="
#4F46E5"
    />
    <title>Spaced-Repetition Study Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        overscroll-behavior: none;
      }
      .fade-in {
        animation: fadeIn 0.3s ease-in;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .slide-up {
        animation: slideUp 0.3s ease-out;
      }
      @keyframes slideUp {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      button,
      .clickable {
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
      input,
      textarea {
        font-size: 16px;
      }
      .safe-area-top {
        padding-top: env(safe-area-inset-top);
      }
      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .touch-card {
        transition: all 0.2s;
      }
      .touch-card:active {
        transform: scale(0.98);
        opacity: 0.9;
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen"
  >
    <div id="app"></div>
    <script>
      const icons = {
        brain:
          '<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M19.938 10.5a4 4 0 0 1 .585.396"/><path d="M6 18a4 4 0 0 1-1.967-.516"/><path d="M19.967 17.484A4 4 0 0 1 18 18"/>',
        trophy:
          '<path d="M13 2 L3 14 H12 L11 22 L21 10 H12 L13 2 Z"/>',
        flame:
          '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
        bookOpen:
          '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
        plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
        calendar:
          '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
        trendingUp:
          '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
        target:
          '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
        zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
        upload:
          '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
        trash:
          '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
        helpCircle:
          '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
        x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
        checkCircle:
          '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>',
        award:
          '<path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/>',
        folder:
          '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
        folderOpen:
          '<path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>',
        chevronDown: '<path d="m6 9 6 6 6-6"/>',
        chevronRight: '<path d="m9 18 6-6-6-6"/>',
      };

      function icon(name, className = "w-5 h-5") {
        return `<svg class="${className}" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[name]}</svg>`;
      }

      const SM2 = {
        calculate: (quality, easeFactor, interval, repetitions) => {
          let newEF = easeFactor,
            newInterval = interval,
            newReps = repetitions;
          if (quality >= 3) {
            if (repetitions === 0) newInterval = 1;
            else if (repetitions === 1) newInterval = 6;
            else newInterval = Math.round(interval * easeFactor);
            newReps = repetitions + 1;
          } else {
            newReps = 0;
            newInterval = 1;
          }
          newEF =
            easeFactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
          if (newEF < 1.3) newEF = 1.3;
          return {
            easeFactor: newEF,
            interval: newInterval,
            repetitions: newReps,
          };
        },
        getNextDueDate: (interval) => {
          const date = new Date();
          date.setDate(date.getDate() + interval);
          return date.toISOString().split("T")[0];
        },
      };

      const Storage = {
        get: (key, defaultValue = null) => {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : defaultValue;
        },
        set: (key, value) => localStorage.setItem(key, JSON.stringify(value)),
      };

      const initializeUserData = () => {
        const existingUser = Storage.get("user");
        if (!existingUser) {
          Storage.set("user", {
            id: "1",
            email: "student@studyhub.com",
            name: "Student",
            xp: 0,
            streak: 0,
            lastReviewDate: null, // 🧠 added for streak tracking
            level: 1,
          });
          Storage.set("collections", []);
          Storage.set("decks", []);
          Storage.set("cards", []);
        } else {
          // ✅ ensure older users get the new field too
          if (!("lastReviewDate" in existingUser)) {
            existingUser.lastReviewDate = null;
            Storage.set("user", existingUser);
          }
        }
      };

      let state = {
        user: null,
        collections: [],
        decks: [],
        cards: [],
        currentView: "dashboard",
        selectedCollection: null,
        selectedDeck: null,
        reviewMode: false,
        currentCardIndex: 0,
        showAnswer: false,
        reviewQueue: [],
        showGuide: false,
        showGamification: false,
        expandedCollections: {},
      };

      function loadData() {
        state.user = Storage.get("user");
        state.collections = Storage.get("collections", []);
        state.decks = Storage.get("decks", []);
        state.cards = Storage.get("cards", []);
      }

      function getTodaysDueCards() {
        const today = new Date().toISOString().split("T")[0];
        return state.cards.filter((card) => card.nextDue <= today);
      }

      function getThisWeekReviews() {
        const today = new Date();
        const weekAgo = new Date(today);
        weekAgo.setDate(today.getDate() - 7);
        return state.cards.filter((card) => {
          const lastReview = new Date(card.nextDue);
          return card.repetitions > 0 && lastReview >= weekAgo;
        }).length;
      }

      function startReview(deckId = null, collectionId = null) {
        let queue;
        const today = new Date().toISOString().split("T")[0];
        if (collectionId) {
          const collectionDeckIds = state.decks
            .filter((d) => d.collectionId === collectionId)
            .map((d) => d.id);
          queue = state.cards.filter(
            (card) =>
              collectionDeckIds.includes(card.deckId) && card.nextDue <= today
          );
        } else if (deckId) {
          queue = state.cards.filter(
            (card) => card.deckId === deckId && card.nextDue <= today
          );
        } else {
          queue = getTodaysDueCards();
        }
        if (queue.length === 0) {
          alert("No cards due for review!");
          return;
        }
        state.reviewQueue = queue;
        state.currentCardIndex = 0;
        state.showAnswer = false;
        state.reviewMode = true;
        render();
      }
      function rateCard(quality) {
        const card = state.reviewQueue[state.currentCardIndex];
        const { easeFactor, interval, repetitions } = SM2.calculate(
          quality,
          card.easeFactor,
          card.interval,
          card.repetitions
        );

        const updatedCard = {
          ...card,
          easeFactor,
          interval,
          repetitions,
          nextDue: SM2.getNextDueDate(interval),
        };

        // ✅ Update cards
        state.cards = state.cards.map((c) =>
          c.id === card.id ? updatedCard : c
        );
        Storage.set("cards", state.cards);

        // 💥 XP + Level system
        const xpGain = quality >= 4 ? 15 : quality >= 3 ? 10 : 5;
        const oldLevel = state.user.level;
        state.user.xp += xpGain;
        const newLevel = calculateLevel(state.user.xp);
        state.user.level = newLevel;
        Storage.set("user", state.user);

        if (newLevel > oldLevel) {
          setTimeout(
            () =>
              alert(
                `🎉 LEVEL UP! You've reached Level ${newLevel}! 🎉\n\nKeep up the great work!`
              ),
            300
          );
        }

        // 🔥 Streak system
        const today = new Date().toISOString().split("T")[0];
        const lastReviewDate = state.user.lastReviewDate;

        if (lastReviewDate !== today) {
          const yesterday = new Date();
          yesterday.setDate(yesterday.getDate() - 1);
          const yesterdayStr = yesterday.toISOString().split("T")[0];

          if (lastReviewDate === yesterdayStr) {
            state.user.streak += 1;
            showStreakPopup(`🔥 Streak +1! (${state.user.streak} days)`);
          } else {
            state.user.streak = 1;
            showStreakPopup(`🔥 New Streak Started!`);
          }

          state.user.lastReviewDate = today;
          Storage.set("user", state.user);
        }

        // 🎯 Handle next card or finish
        if (state.currentCardIndex < state.reviewQueue.length - 1) {
          state.currentCardIndex++;
          state.showAnswer = false;
          render();
        } else {
          state.reviewMode = false;
          state.currentView = "dashboard";
          alert(
            `Review complete! You earned ${
              xpGain * state.reviewQueue.length
            } XP!`
          );
          render();
        }
      }

      function calculateLevel(xp) {
        if (xp < 2000) return 1;
        if (xp < 3000) return 2;
        if (xp < 4250) return 3;
        if (xp < 5750) return 4;
        if (xp < 7500) return 5;
        if (xp < 9500) return 6;
        if (xp < 11750) return 7;
        if (xp < 14250) return 8;
        let level = 9,
          threshold = 14250,
          increment = 2750;
        while (xp >= threshold + increment) {
          threshold += increment;
          increment += 250;
          level++;
        }
        return level;
      }

      function getXPForNextLevel(currentLevel) {
        if (currentLevel === 1) return 2000;
        if (currentLevel === 2) return 1000;
        if (currentLevel === 3) return 1250;
        if (currentLevel === 4) return 1500;
        if (currentLevel === 5) return 1750;
        if (currentLevel === 6) return 2000;
        if (currentLevel === 7) return 2250;
        if (currentLevel === 8) return 2500;
        return 2500 + (currentLevel - 8) * 250;
      }

      function getXPProgress() {
        const currentLevel = state.user.level;
        const totalXP = state.user.xp;
        let xpForCurrentLevel = 0;
        for (let i = 1; i < currentLevel; i++) {
          xpForCurrentLevel += getXPForNextLevel(i);
        }
        const xpIntoCurrentLevel = totalXP - xpForCurrentLevel;
        const xpNeededForNext = getXPForNextLevel(currentLevel);
        const progressPercent = Math.min(
          (xpIntoCurrentLevel / xpNeededForNext) * 100,
          100
        );
        return {
          current: xpIntoCurrentLevel,
          needed: xpNeededForNext,
          percent: progressPercent,
        };
      }

      function createCollection(title, description) {
        if (!title) return;
        const newCollection = {
          id: Date.now().toString(),
          userId: state.user.id,
          title,
          description,
          deckCount: 0,
          cardCount: 0,
          dueToday: 0,
        };
        state.collections.push(newCollection);
        Storage.set("collections", state.collections);
        state.currentView = "dashboard";
        render();
      }

      function createDeck(title, courseCode, collectionId = null) {
        if (!title) return;
        const newDeck = {
          id: Date.now().toString(),
          userId: state.user.id,
          collectionId,
          title,
          courseCode,
          cardCount: 0,
          dueToday: 0,
        };
        state.decks.push(newDeck);
        Storage.set("decks", state.decks);
        if (collectionId) {
          state.collections = state.collections.map((c) =>
            c.id === collectionId ? { ...c, deckCount: c.deckCount + 1 } : c
          );
          Storage.set("collections", state.collections);
        }
        state.currentView = "dashboard";
        state.selectedCollection = null;
        render();
      }

      function createCard(front, back, tags) {
        if (!front || !back || !state.selectedDeck) return;
        const newCard = {
          id: Date.now().toString(),
          deckId: state.selectedDeck.id,
          front,
          back,
          tags: tags
            .split(",")
            .map((t) => t.trim())
            .filter((t) => t),
          easeFactor: 2.5,
          interval: 1,
          repetitions: 0,
          nextDue: new Date().toISOString().split("T")[0],
        };
        state.cards.push(newCard);
        Storage.set("cards", state.cards);
        state.decks = state.decks.map((d) =>
          d.id === state.selectedDeck.id
            ? { ...d, cardCount: d.cardCount + 1, dueToday: d.dueToday + 1 }
            : d
        );
        Storage.set("decks", state.decks);
        const deck = state.decks.find((d) => d.id === state.selectedDeck.id);
        if (deck && deck.collectionId) {
          state.collections = state.collections.map((c) =>
            c.id === deck.collectionId
              ? { ...c, cardCount: c.cardCount + 1, dueToday: c.dueToday + 1 }
              : c
          );
          Storage.set("collections", state.collections);
        }
        render();
      }

      function deleteCollection(collectionId) {
        if (
          !confirm(
            "Are you sure you want to delete this collection and ALL its decks and cards?"
          )
        )
          return;
        const deckIdsToDelete = state.decks
          .filter((d) => d.collectionId === collectionId)
          .map((d) => d.id);
        state.cards = state.cards.filter(
          (c) => !deckIdsToDelete.includes(c.deckId)
        );
        state.decks = state.decks.filter(
          (d) => d.collectionId !== collectionId
        );
        state.collections = state.collections.filter(
          (c) => c.id !== collectionId
        );
        Storage.set("collections", state.collections);
        Storage.set("decks", state.decks);
        Storage.set("cards", state.cards);
        state.currentView = "dashboard";
        state.selectedCollection = null;
        render();
      }

      function deleteDeck(deckId) {
        if (
          !confirm(
            "Are you sure you want to delete this deck and all its cards?"
          )
        )
          return;
        const deck = state.decks.find((d) => d.id === deckId);
        const cardCount = state.cards.filter((c) => c.deckId === deckId).length;
        state.decks = state.decks.filter((d) => d.id !== deckId);
        state.cards = state.cards.filter((c) => c.deckId !== deckId);
        Storage.set("decks", state.decks);
        Storage.set("cards", state.cards);
        if (deck && deck.collectionId) {
          state.collections = state.collections.map((c) =>
            c.id === deck.collectionId
              ? {
                  ...c,
                  deckCount: c.deckCount - 1,
                  cardCount: c.cardCount - cardCount,
                }
              : c
          );
          Storage.set("collections", state.collections);
        }
        state.currentView = "dashboard";
        state.selectedDeck = null;
        render();
      }

      function deleteCard(cardId) {
        if (!confirm("Are you sure you want to delete this card?")) return;
        const card = state.cards.find((c) => c.id === cardId);
        state.cards = state.cards.filter((c) => c.id !== cardId);
        Storage.set("cards", state.cards);
        state.decks = state.decks.map((d) =>
          d.id === card.deckId ? { ...d, cardCount: d.cardCount - 1 } : d
        );
        Storage.set("decks", state.decks);
        const deck = state.decks.find((d) => d.id === card.deckId);
        if (deck && deck.collectionId) {
          state.collections = state.collections.map((c) =>
            c.id === deck.collectionId
              ? { ...c, cardCount: c.cardCount - 1 }
              : c
          );
          Storage.set("collections", state.collections);
        }
        render();
      }

      function resetAllData() {
        if (
          !confirm(
            "⚠️ This will delete ALL your collections, decks, cards, and progress. Are you absolutely sure?"
          )
        )
          return;
        if (!confirm("This action cannot be undone. Click OK to proceed."))
          return;
        localStorage.clear();
        location.reload();
      }

      function toggleCollection(collectionId) {
        state.expandedCollections[collectionId] =
          !state.expandedCollections[collectionId];
        render();
      }

      function handleCSVImport(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const text = e.target.result;
          const lines = text.split("\n").slice(1);
          const newCards = lines
            .filter((line) => line.trim())
            .map((line, index) => {
              const [front, back, tags] = line
                .split(",")
                .map((s) => s.trim().replace(/^"|"$/g, ""));
              return {
                id: (Date.now() + index).toString(),
                deckId: state.selectedDeck.id,
                front,
                back,
                tags: tags ? tags.split(";").map((t) => t.trim()) : [],
                easeFactor: 2.5,
                interval: 1,
                repetitions: 0,
                nextDue: new Date().toISOString().split("T")[0],
              };
            });
          state.cards.push(...newCards);
          Storage.set("cards", state.cards);
          state.decks = state.decks.map((d) =>
            d.id === state.selectedDeck.id
              ? {
                  ...d,
                  cardCount: d.cardCount + newCards.length,
                  dueToday: d.dueToday + newCards.length,
                }
              : d
          );
          Storage.set("decks", state.decks);
          const deck = state.decks.find((d) => d.id === state.selectedDeck.id);
          if (deck && deck.collectionId) {
            state.collections = state.collections.map((c) =>
              c.id === deck.collectionId
                ? {
                    ...c,
                    cardCount: c.cardCount + newCards.length,
                    dueToday: c.dueToday + newCards.length,
                  }
                : c
            );
            Storage.set("collections", state.collections);
          }
          alert(`Imported ${newCards.length} cards successfully!`);
          render();
        };
        reader.readAsText(file);
      }

      // RENDER FUNCTIONS CONTINUE IN NEXT MESSAGE DUE TO LENGTH

      // RENDER FUNCTIONS (Continuing from where you stopped)

      function renderReviewMode() {
        const card = state.reviewQueue[state.currentCardIndex];
        return `
                <div class="max-w-2xl mx-auto pt-4 px-3 pb-safe">
                    <div class="bg-white rounded-2xl shadow-xl p-4 sm:p-8 slide-up">
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-xs sm:text-sm font-medium text-gray-600">
                                Card ${state.currentCardIndex + 1} of ${
          state.reviewQueue.length
        }
                            </span>
                            <div class="flex gap-2">
                                ${icon(
                                  "trophy",
                                  "w-4 h-4 sm:w-5 sm:h-5 text-yellow-500"
                                )}
                                <span class="font-semibold text-gray-700 text-sm sm:text-base">${
                                  state.user.xp
                                } XP</span>
                            </div>
                        </div>

                        <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl p-6 sm:p-8 mb-4 min-h-[250px] sm:min-h-64 flex items-center justify-center text-center touch-card">
                            <p class="text-xl sm:text-2xl text-white font-medium break-words">
                                ${state.showAnswer ? card.back : card.front}
                            </p>
                        </div>

                        ${
                          !state.showAnswer
                            ? `
                            <button onclick="state.showAnswer = true; render();"
                                class="w-full bg-indigo-600 active:bg-indigo-700 text-white font-semibold py-4 rounded-xl transition-colors text-base sm:text-lg touch-card">
                                Show Answer
                            </button>
                        `
                            : `
                            <div class="space-y-3">
                                <p class="text-center text-xs sm:text-sm font-medium text-gray-700 mb-3">How well did you know this?</p>
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                    <button onclick="rateCard(1)" class="bg-red-100 active:bg-red-200 text-red-700 font-semibold py-4 rounded-lg transition-colors text-sm sm:text-base touch-card">Again</button>
                                    <button onclick="rateCard(3)" class="bg-yellow-100 active:bg-yellow-200 text-yellow-700 font-semibold py-4 rounded-lg transition-colors text-sm sm:text-base touch-card">Hard</button>
                                    <button onclick="rateCard(4)" class="bg-green-100 active:bg-green-200 text-green-700 font-semibold py-4 rounded-lg transition-colors text-sm sm:text-base touch-card">Good</button>

      function renderAnalytics() {
        const totalReviews = state.cards.reduce(
          (sum, card) => sum + card.repetitions,
          0
        );
        const averageEF =
          state.cards.length > 0
            ? (
                state.cards.reduce((sum, card) => sum + card.easeFactor, 0) /
                state.cards.length
              ).toFixed(2)
            : "2.50";
        const cardsLearning = state.cards.filter(
          (c) => c.repetitions > 0 && c.repetitions < 3
        ).length;
        const cardsMature = state.cards.filter(
          (c) => c.repetitions >= 3
        ).length;
        const cardsNew = state.cards.filter((c) => c.repetitions === 0).length;

        return `

                                <div class="text-2xl sm:text-3xl font-bold text-orange-600 mb-1">${
                                  state.user.streak
                                }</div>
                                <div class="text-xs sm:text-sm text-gray-600 font-medium">Day Streak</div>
                            </div>
                            <div class="bg-gradient-to-br from-purple-50 to-purple-100 rounded-xl p-4 text-center">
                                <div class="text-2xl sm:text-3xl font-bold text-purple-600 mb-1">${totalReviews}</div>
                                <div class="text-xs sm:text-sm text-gray-600 font-medium">Reviews</div>
                            </div>
                            <div class="bg-gradient-to-br from-green-50 to-green-100 rounded-xl p-4 text-center">
                                <div class="text-2xl sm:text-3xl font-bold text-green-600 mb-1">${
                                  state.user.level
                                }</div>
                                <div class="text-xs sm:text-sm text-gray-600 font-medium">Level</div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-md p-4 sm:p-6">
                        <h3 class="text-lg sm:text-xl font-bold text-gray-900 mb-4">Card Distribution</h3>

                            <div>
                                <div class="flex justify-between mb-2">
                                    <span class="text-sm sm:text-base text-gray-700 font-medium">New Cards</span>
                                    <span class="text-sm sm:text-base font-bold text-blue-600">${cardsNew}</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-3">
                                    <div class="bg-blue-500 h-3 rounded-full" style="width: ${
                                      state.cards.length > 0
                                        ? (cardsNew / state.cards.length) * 100
                                        : 0
                                    }%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between mb-2">
                                    <span class="text-sm sm:text-base text-gray-700 font-medium">Learning</span>
                                    <span class="text-sm sm:text-base font-bold text-yellow-600">${cardsLearning}</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-3">
                                    <div class="bg-yellow-500 h-3 rounded-full" style="width: ${
                                      state.cards.length > 0
                                        ? (cardsLearning / state.cards.length) *
                                          100
                                        : 0
                                    }%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between mb-2">
                                    <span class="text-sm sm:text-base text-gray-700 font-medium">Mature</span>
                                    <span class="text-sm sm:text-base font-bold text-green-600">${cardsMature}</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-3">
                                    <div class="bg-green-500 h-3 rounded-full" style="width: ${

                                <div class="text-xs sm:text-sm text-gray-600 font-medium mb-1">Collections</div>

                                  state.collections.length

                                <div class="text-xs text-gray-500 mt-1">${
                                  state.decks.length

                            </div>

                </div>

      function renderDeckDetails() {

                                <textarea id="cardFront" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none text-base" rows="3" placeholder="Enter your question..."></textarea>
                            </div>

                            </div>
                            <div>

                                <input type="text" id="cardTags" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none text-base" placeholder="e.g., algorithms, basics">
                            </div>
                            <div class="flex flex-col sm:flex-row gap-3">
                                <button onclick="createCard(document.getElementById('cardFront').value, document.getElementById('cardBack').value, document.getElementById('cardTags').value); document.getElementById('cardFront').value=''; document.getElementById('cardBack').value=''; document.getElementById('cardTags').value='';"
                                    class="flex-1 bg-green-600 active:bg-green-700 text-white font-semibold px-6 py-4 rounded-lg transition-colors touch-card">
                                    Add Card
                                </button>
                                <label class="flex-1 flex items-center justify-center gap-2 bg-blue-600 active:bg-blue-700 text-white font-semibold px-6 py-4 rounded-lg cursor-pointer transition-colors touch-card">
                                    ${icon("upload", "w-5 h-5")} Import CSV
                                    <input type="file" accept=".csv" onchange="if(this.files[0]) handleCSVImport(this.files[0]);" class="hidden">
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-md p-4 sm:p-6">
                        <h3 class="text-lg sm:text-xl font-bold text-gray-900 mb-4">Cards in this Deck</h3>
                        ${
                          deckCards.length === 0
                            ? `
                            <div class="text-center py-8">
                                <p class="text-sm sm:text-base text-gray-500">No cards yet. Add some cards to start studying!</p>
                            </div>
                        `
                            : `
                            <div class="space-y-3">
                                ${deckCards
                                  .map(
                                    (card) => `
                                    <div class="border-2 border-gray-200 rounded-lg p-4 group relative">
                                        <button onclick="deleteCard('${
                                          card.id
                                        }');"
                                            class="absolute top-3 right-3 bg-red-100 active:bg-red-200 text-red-600 p-2 rounded-lg">
                                            ${icon("trash", "w-4 h-4")}
                                        </button>
                                        <div class="flex flex-col sm:flex-row items-start justify-between">
                                            <div class="flex-1 pr-12 mb-2 sm:mb-0">

                                                <p class="text-gray-600 text-xs sm:text-sm mb-2">${
                                                  card.back

                                                <div class="flex flex-wrap gap-2">
                                                    ${card.tags

                                                        (tag) =>
                                                          `<span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-1 rounded-full">${tag}</span>`

                                        </div>
                                    </div>
                                `
                                  )
                                  .join("")}
                            </div>

                        }
                    </div>
                </div>
            `;
      }

        return `
                <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-3 sm:p-4 z-50 fade-in">
                    <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto slide-up">
                        <div class="sticky top-0 bg-white border-b border-gray-200 p-4 sm:p-6 flex items-center justify-between">

                                        <span class="text-2xl">🟢</span>
                                        <div class="flex-1">

                                    </div>

      function renderGuide() {
        if (!state.showGuide) return "";
        return `
                <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-3 sm:p-4 z-50 fade-in">
                    <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto slide-up">
                        <div class="sticky top-0 bg-white border-b border-gray-200 p-4 sm:p-6 flex items-center justify-between">
                            <h2 class="text-lg sm:text-2xl font-bold text-gray-900">How It Works</h2>
                            <button onclick="state.showGuide = false; render();" class="text-gray-500 active:text-gray-700 transition-colors p-2 touch-card">
                                ${icon("x", "w-5 h-5 sm:w-6 sm:h-6")}
                            </button>
                        </div>

                        <div class="p-4 sm:p-6 space-y-4 sm:space-y-6">
                            <section>
                                <h3 class="text-lg sm:text-xl font-bold text-indigo-600 mb-2 sm:mb-3">📚 What is Spaced Repetition?</h3>
                                <p class="text-sm sm:text-base text-gray-700 leading-relaxed">

                            </section>

                            <section class="bg-purple-50 rounded-xl p-4 sm:p-5">

                                </p>
                                <ul class="space-y-2 text-sm sm:text-base text-gray-700">
                                    <li class="flex gap-2">
                                        <span class="text-purple-600">•</span>
                                        <span><strong>Create Collections:</strong> Group decks by subject (e.g., "Japanese Language")</span>
                                    </li>
                                    <li class="flex gap-2">
                                        <span class="text-purple-600">•</span>
                                        <span><strong>Quick Review:</strong> Review all cards in a collection with one click</span>
                                    </li>
                                    <li class="flex gap-2">
                                        <span class="text-purple-600">•</span>
                                        <span><strong>Flexible Structure:</strong> Have both organized and standalone decks</span>

                        </div>
                    </div>
                </div>
            `;
      }

      // Initialize
      initializeUserData();
      loadData();
      render();

      // Service Worker registration
      if (
        "serviceWorker" in navigator &&
        window.location.hostname !== "www.claudeusercontent.com"
      ) {
        navigator.serviceWorker
          .register("/service-worker.js")
          .then(() => console.log("Service Worker registered"))
          .catch((err) =>
            console.log("Service Worker not available:", err.message)
          );
      }

      // 🔥 Streak popup helper function with fade + float animation
      function showStreakPopup(message) {
        const popup = document.createElement("div");
        popup.textContent = message;
        popup.className =
          "streak-popup fixed top-6 left-1/2 transform -translate-x-1/2 bg-orange-500 text-white font-bold px-6 py-3 rounded-full shadow-lg text-sm sm:text-base z-[9999]";
        document.body.appendChild(popup);

        // trigger animation
        popup.classList.add("fade-in-up");

        // remove after animation ends
        setTimeout(() => popup.remove(), 2500);
      }
    </script>

    <style>
      /* 🌟 Fade and float animation */
      @keyframes fadeInUp {
        0% {
          opacity: 0;
          transform: translate(-50%, 20px);
        }
        20% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        80% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -20px);
        }
      }

      .fade-in-up {
        animation: fadeInUp 2.3s ease forwards;
      }
    </style>
