<html lang="en">
<head>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Study Hub">

    <title>Spaced-Repetition Study Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { overscroll-behavior: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        button, .clickable { -webkit-touch-callout: none; touch-action: manipulation; }
        input, textarea { font-size: 16px; } /* Prevents zoom on iOS */

        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .touch-card { transition: all 0.2s; }
        .touch-card:active { transform: scale(0.98); opacity: 0.9; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen">

<div id="app"></div>

<script>
// Lucide Icons SVG paths
const icons = {

    trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
    flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
    bookOpen: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
    plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',

    upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
    trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
    helpCircle: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    checkCircle: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>',
    award: '<path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/>'
};

function icon(name, className = 'w-5 h-5') {
    return `<svg class="${className}" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[name]}</svg>`;
}

// SM-2 Algorithm
const SM2 = {
    calculate: (quality, easeFactor, interval, repetitions) => {
        let newEF = easeFactor;
        let newInterval = interval;
        let newReps = repetitions;

        if (quality >= 3) {
            if (repetitions === 0) {
                newInterval = 1;
            } else if (repetitions === 1) {
                newInterval = 6;
            } else {
                newInterval = Math.round(interval * easeFactor);
            }
            newReps = repetitions + 1;
        } else {
            newReps = 0;
            newInterval = 1;
        }

        newEF = easeFactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
        if (newEF < 1.3) newEF = 1.3;

        return { easeFactor: newEF, interval: newInterval, repetitions: newReps };
    },

    getNextDueDate: (interval) => {
        const date = new Date();
        date.setDate(date.getDate() + interval);
        return date.toISOString().split('T')[0];
    }
};

// Storage
const Storage = {
    get: (key, defaultValue = null) => {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : defaultValue;
    },
    set: (key, value) => {
        localStorage.setItem(key, JSON.stringify(value));
    }
};

// Initialize User Data
const initializeUserData = () => {
    const existingUser = Storage.get('user');
    if (!existingUser) {
        Storage.set('user', { id: '1', email: 'student@studyhub.com', name: 'Student', xp: 0, streak: 0, level: 1 });
        Storage.set('decks', []);
        Storage.set('cards', []);
    }
};

// App State
let state = {
    user: null,
    decks: [],
    cards: [],
    currentView: 'dashboard',
    selectedDeck: null,
    reviewMode: false,
    currentCardIndex: 0,
    showAnswer: false,
    reviewQueue: [],
    showGuide: false,
    showGamification: false
};

function loadData() {
    state.user = Storage.get('user');
    state.decks = Storage.get('decks', []);
    state.cards = Storage.get('cards', []);
}

function getTodaysDueCards() {
    const today = new Date().toISOString().split('T')[0];
    return state.cards.filter(card => card.nextDue <= today);
}

function getThisWeekReviews() {
    const today = new Date();
    const weekAgo = new Date(today);
    weekAgo.setDate(today.getDate() - 7);
    
    return state.cards.filter(card => {
        const lastReview = new Date(card.nextDue);
        return card.repetitions > 0 && lastReview >= weekAgo;
    }).length;
}

function startReview(deckId = null) {
    let queue;
    if (deckId) {
        const today = new Date().toISOString().split('T')[0];
        queue = state.cards.filter(card => card.deckId === deckId && card.nextDue <= today);
    } else {
        queue = getTodaysDueCards();
    }
    
    if (queue.length === 0) {
        alert('No cards due for review!');
        return;
    }
    
    state.reviewQueue = queue;
    state.currentCardIndex = 0;
    state.showAnswer = false;
    state.reviewMode = true;
    render();
}

function rateCard(quality) {
    const card = state.reviewQueue[state.currentCardIndex];
    const { easeFactor, interval, repetitions } = SM2.calculate(quality, card.easeFactor, card.interval, card.repetitions);

    const updatedCard = { ...card, easeFactor, interval, repetitions, nextDue: SM2.getNextDueDate(interval) };
    state.cards = state.cards.map(c => c.id === card.id ? updatedCard : c);
    Storage.set('cards', state.cards);

    const xpGain = quality >= 4 ? 15 : quality >= 3 ? 10 : 5;
    state.user.xp += xpGain;
    Storage.set('user', state.user);

    if (state.currentCardIndex < state.reviewQueue.length - 1) {
        state.currentCardIndex++;
        state.showAnswer = false;
        render();
    } else {
        state.reviewMode = false;
        state.currentView = 'dashboard';
        alert(`Review complete! You earned ${xpGain * state.reviewQueue.length} XP!`);
        render();
    }
}

function createDeck(title, courseCode) {
    if (!title) return;
    const newDeck = {
        id: Date.now().toString(),
        userId: state.user.id,
        title,
        courseCode,
        cardCount: 0,
        dueToday: 0
    };
    state.decks.push(newDeck);
    Storage.set('decks', state.decks);
    state.currentView = 'dashboard';
    render();
}

function createCard(front, back, tags) {
    if (!front || !back || !state.selectedDeck) return;
    const newCard = {
        id: Date.now().toString(),
        deckId: state.selectedDeck.id,
        front, back,
        tags: tags.split(',').map(t => t.trim()).filter(t => t),
        easeFactor: 2.5,
        interval: 1,
        repetitions: 0,
        nextDue: new Date().toISOString().split('T')[0]
    };
    state.cards.push(newCard);
    Storage.set('cards', state.cards);
    
    state.decks = state.decks.map(d => 
        d.id === state.selectedDeck.id ? { ...d, cardCount: d.cardCount + 1, dueToday: d.dueToday + 1 } : d
    );
    Storage.set('decks', state.decks);
    render();
}

function deleteDeck(deckId) {
    if (!confirm('Are you sure you want to delete this deck and all its cards?')) return;
    state.decks = state.decks.filter(d => d.id !== deckId);
    state.cards = state.cards.filter(c => c.deckId !== deckId);
    Storage.set('decks', state.decks);
    Storage.set('cards', state.cards);
    state.currentView = 'dashboard';
    state.selectedDeck = null;
    render();
}

function deleteCard(cardId) {
    if (!confirm('Are you sure you want to delete this card?')) return;
    const card = state.cards.find(c => c.id === cardId);
    state.cards = state.cards.filter(c => c.id !== cardId);
    Storage.set('cards', state.cards);
    
    state.decks = state.decks.map(d => 
        d.id === card.deckId ? { ...d, cardCount: d.cardCount - 1 } : d
    );
    Storage.set('decks', state.decks);
    render();
}

function resetAllData() {
    if (!confirm('⚠️ This will delete ALL your decks, cards, and progress. Are you absolutely sure?')) return;
    if (!confirm('This action cannot be undone. Click OK to proceed.')) return;
    localStorage.clear();
    location.reload();
}

function handleCSVImport(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const text = e.target.result;
        const lines = text.split('\n').slice(1);
        
        const newCards = lines.filter(line => line.trim()).map((line, index) => {
            const [front, back, tags] = line.split(',').map(s => s.trim().replace(/^"|"$/g, ''));
            return {
                id: (Date.now() + index).toString(),
                deckId: state.selectedDeck.id,
                front, back,
                tags: tags ? tags.split(';').map(t => t.trim()) : [],
                easeFactor: 2.5, interval: 1, repetitions: 0,
                nextDue: new Date().toISOString().split('T')[0]
            };
        });

        state.cards.push(...newCards);
        Storage.set('cards', state.cards);

        state.decks = state.decks.map(d => 
            d.id === state.selectedDeck.id 
                ? { ...d, cardCount: d.cardCount + newCards.length, dueToday: d.dueToday + newCards.length }
                : d
        );
        Storage.set('decks', state.decks);
        alert(`Imported ${newCards.length} cards successfully!`);
        render();
    };
    reader.readAsText(file);
}

// Render Functions
function renderReviewMode() {
    const card = state.reviewQueue[state.currentCardIndex];
    return `
        <div class="max-w-2xl mx-auto pt-4 px-3 pb-safe">
            <div class="bg-white rounded-2xl shadow-xl p-4 sm:p-8 slide-up">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs sm:text-sm font-medium text-gray-600">
                        Card ${state.currentCardIndex + 1} of ${state.reviewQueue.length}
                    </span>
                    <div class="flex gap-2">
                        ${icon('trophy', 'w-4 h-4 sm:w-5 sm:h-5 text-yellow-500')}
                        <span class="font-semibold text-gray-700 text-sm sm:text-base">${state.user.xp} XP</span>
                    </div>
                </div>

                <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl p-6 sm:p-8 mb-4 min-h-[250px] sm:min-h-64 flex items-center justify-center text-center touch-card">
                    <p class="text-xl sm:text-2xl text-white font-medium break-words">
                        ${state.showAnswer ? card.back : card.front}
                    </p>
                </div>

                ${!state.showAnswer ? `
                    <button onclick="state.showAnswer = true; render();" 
                        class="w-full bg-indigo-600 active:bg-indigo-700 text-white font-semibold py-4 sm:py-4 rounded-xl transition-colors text-base sm:text-lg touch-card">
                        Show Answer
                    </button>
                ` : `
                    <div class="space-y-3">
                        <p class="text-center text-xs sm:text-sm font-medium text-gray-700 mb-3">How well did you know this?</p>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            <button onclick="rateCard(1)" class="bg-red-100 active:bg-red-200 text-red-700 font-semibold py-4 rounded-lg transition-colors text-sm sm:text-base touch-card">Again</button>
                            <button onclick="rateCard(3)" class="bg-yellow-100 active:bg-yellow-200 text-yellow-700 font-semibold py-4 rounded-lg transition-colors text-sm sm:text-base touch-card">Hard</button>
                            <button onclick="rateCard(4)" class="bg-green-100 active:bg-green-200 text-green-700 font-semibold py-4 rounded-lg transition-colors text-sm sm:text-base touch-card">Good</button>
                            <button onclick="rateCard(5)" class="bg-blue-100 active:bg-blue-200 text-blue-700 font-semibold py-4 rounded-lg transition-colors text-sm sm:text-base touch-card">Easy</button>
                        </div>
                    </div>
                `}
            </div>
        </div>
    `;
}

function renderDashboard() {

    return `

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
                <div class="bg-white rounded-xl shadow-md p-4 sm:p-6 border-l-4 border-indigo-500">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center sm:justify-between">
                        <div>
                            <p class="text-xs sm:text-sm text-gray-600 font-medium">Due Today</p>
                            <p class="text-2xl sm:text-3xl font-bold text-gray-900">${dueToday}</p>
                        </div>
                        ${icon('calendar', 'w-8 h-8 sm:w-10 sm:h-10 text-indigo-500 opacity-80 mt-2 sm:mt-0')}

                        ${icon('bookOpen', 'w-8 h-8 sm:w-10 sm:h-10 text-purple-500 opacity-80 mt-2 sm:mt-0')}
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-md p-4 sm:p-6 border-l-4 border-green-500">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center sm:justify-between">
                        <div>
                            <p class="text-xs sm:text-sm text-gray-600 font-medium">Total Cards</p>
                            <p class="text-2xl sm:text-3xl font-bold text-gray-900">${state.cards.length}</p>
                        </div>
                        ${icon('target', 'w-8 h-8 sm:w-10 sm:h-10 text-green-500 opacity-80 mt-2 sm:mt-0')}
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-md p-4 sm:p-6 border-l-4 border-yellow-500">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center sm:justify-between">
                        <div>
                            <p class="text-xs sm:text-sm text-gray-600 font-medium">This Week</p>
                            <p class="text-2xl sm:text-3xl font-bold text-gray-900">${thisWeek}</p>
                        </div>
                        ${icon('trendingUp', 'w-8 h-8 sm:w-10 sm:h-10 text-yellow-500 opacity-80 mt-2 sm:mt-0')}
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="bg-white rounded-xl shadow-md p-4 sm:p-6">
                <h2 class="text-lg sm:text-xl font-bold text-gray-900 mb-4">Quick Actions</h2>

                    <button onclick="startReview()"

                        ${icon('zap', 'w-5 h-5 sm:w-6 sm:h-6')} <span class="text-sm sm:text-base">Start Daily Review</span>

                    <button onclick="state.currentView = 'createDeck'; render();"

                        ${icon('plus', 'w-5 h-5 sm:w-6 sm:h-6')} <span class="text-sm sm:text-base">Create New Deck</span>
                    </button>
                    <button onclick="state.currentView = 'analytics'; render();" 
                        class="flex items-center justify-center gap-3 bg-gradient-to-r from-blue-500 to-cyan-600 active:from-blue-600 active:to-cyan-700 text-white font-semibold py-4 px-6 rounded-xl transition-all touch-card">
                        ${icon('trendingUp', 'w-5 h-5 sm:w-6 sm:h-6')} <span class="text-sm sm:text-base">View Analytics</span>
                    </button>
                </div>
            </div>

            <!-- Decks List -->
            <div class="bg-white rounded-xl shadow-md p-4 sm:p-6">
                <h2 class="text-lg sm:text-xl font-bold text-gray-900 mb-4">Your Decks</h2>
                ${state.decks.length === 0 ? `
                    <div class="text-center py-8 sm:py-12">
                        ${icon('bookOpen', 'w-12 h-12 sm:w-16 sm:h-16 text-gray-300 mx-auto mb-4')}

                        <p class="text-sm sm:text-base text-gray-500 mb-4">Create your first deck to start studying!</p>
                        <button onclick="state.currentView = 'createDeck'; render();" 
                            class="bg-indigo-600 active:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-lg transition-colors text-sm sm:text-base touch-card">
                            Create Your First Deck
                        </button>
                    </div>

                    <div class="grid grid-cols-1 gap-3 sm:gap-4">

                                class="border-2 border-gray-200 active:border-indigo-500 rounded-xl p-4 sm:p-5 cursor-pointer transition-all relative group touch-card">

                                </div>
                                <div class="flex items-center justify-between text-xs sm:text-sm">
                                    <span class="text-gray-600">${deck.cardCount} cards</span>
                                    <span class="bg-red-100 text-red-700 px-2 sm:px-3 py-1 rounded-full font-semibold">${deck.dueToday} due</span>
                                </div>
                            </div>

            </div>

    `;
}

function renderCreateDeck() {
    return `
        <div class="bg-white rounded-xl shadow-md p-4 sm:p-8 max-w-2xl mx-auto">
            <h2 class="text-xl sm:text-2xl font-bold text-gray-900 mb-4 sm:mb-6">Create New Deck</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Deck Title</label>
                    <input type="text" id="deckTitle" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none text-base" placeholder="e.g., Computer Science 101">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Course Code</label>
                    <input type="text" id="deckCode" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none text-base" placeholder="e.g., CS101">
                </div>
                <div class="flex flex-col sm:flex-row gap-3 pt-4">
                    <button onclick="createDeck(document.getElementById('deckTitle').value, document.getElementById('deckCode').value);" 
                        class="flex-1 bg-indigo-600 active:bg-indigo-700 text-white font-semibold py-4 rounded-lg transition-colors touch-card">
                        Create Deck
                    </button>
                    <button onclick="state.currentView = 'dashboard'; render();" 
                        class="flex-1 bg-gray-200 active:bg-gray-300 text-gray-700 font-semibold py-4 rounded-lg transition-colors touch-card">
                        Cancel
                    </button>
                </div>
            </div>
        </div>

                        <h3 class="text-lg sm:text-xl font-bold text-indigo-600 mb-2 sm:mb-3">⭐ Understanding the Rating System</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-3">
                            <div class="bg-red-50 border-l-4 border-red-500 p-3 sm:p-4 rounded">
                                <h4 class="font-bold text-red-700 mb-1 text-sm sm:text-base">Again (1)</h4>
                                <p class="text-xs sm:text-sm text-gray-700">Didn't remember at all. Card resets and appears tomorrow.</p>
                            </div>
                            <div class="bg-yellow-50 border-l-4 border-yellow-500 p-3 sm:p-4 rounded">
                                <h4 class="font-bold text-yellow-700 mb-1 text-sm sm:text-base">Hard (3)</h4>
                                <p class="text-xs sm:text-sm text-gray-700">Struggled to remember. Shorter interval before next review.</p>
                            </div>
                            <div class="bg-green-50 border-l-4 border-green-500 p-3 sm:p-4 rounded">
                                <h4 class="font-bold text-green-700 mb-1 text-sm sm:text-base">Good (4)</h4>
                                <p class="text-xs sm:text-sm text-gray-700">Remembered correctly. Normal interval (optimal for learning).</p>
                            </div>
                            <div class="bg-blue-50 border-l-4 border-blue-500 p-3 sm:p-4 rounded">
                                <h4 class="font-bold text-blue-700 mb-1 text-sm sm:text-base">Easy (5)</h4>
                                <p class="text-xs sm:text-sm text-gray-700">Instantly remembered. Longer interval before next review.</p>
                            </div>
                        </div>
                    </section>

                    <section class="bg-purple-50 rounded-xl p-4 sm:p-5">
                        <h3 class="text-lg sm:text-xl font-bold text-indigo-600 mb-2 sm:mb-3">🧠 The SM-2 Algorithm</h3>
                        <p class="text-sm sm:text-base text-gray-700 mb-2 sm:mb-3">
                            This app uses the SuperMemo-2 (SM-2) algorithm, developed through decades of research. Here's how it schedules your reviews:
                        </p>
                        <ul class="space-y-1 sm:space-y-2 text-sm sm:text-base text-gray-700">
                            <li class="flex gap-2">
                                <span class="text-indigo-600">•</span>
                                <span><strong>First review:</strong> 1 day later</span>
                            </li>
                            <li class="flex gap-2">
                                <span class="text-indigo-600">•</span>
                                <span><strong>Second review:</strong> 6 days later (if you rated it "Good" or better)</span>
                            </li>
                            <li class="flex gap-2">
                                <span class="text-indigo-600">•</span>
                                <span><strong>Future reviews:</strong> Interval multiplies based on performance</span>
                            </li>
                            <li class="flex gap-2">
                                <span class="text-indigo-600">•</span>
                                <span><strong>If you forget:</strong> Card resets to 1-day interval</span>
                            </li>
                        </ul>
                    </section>

                    <section>
                        <h3 class="text-lg sm:text-xl font-bold text-indigo-600 mb-2 sm:mb-3">📤 CSV Import Format</h3>
                        <p class="text-sm sm:text-base text-gray-700 mb-2 sm:mb-3">Bulk-import flashcards using a CSV file with this format:</p>
                        <div class="bg-gray-900 text-green-400 rounded-lg p-3 sm:p-4 font-mono text-xs sm:text-sm overflow-x-auto">
                            <div>front,back,tags</div>
                            <div>"What is photosynthesis?","Process plants use to make energy","biology;plants"</div>
                            <div>"Capital of France","Paris","geography;europe"</div>
                        </div>
                    </section>

                    <section class="bg-green-50 rounded-xl p-4 sm:p-5">
                        <h3 class="text-lg sm:text-xl font-bold text-indigo-600 mb-2 sm:mb-3">✨ Tips for Success</h3>
                        <ul class="space-y-1 sm:space-y-2 text-sm sm:text-base text-gray-700">
                            <li class="flex gap-2">
                                ${icon('checkCircle', 'w-4 h-4 sm:w-5 sm:h-5 text-green-600 flex-shrink-0 mt-0.5')}
                                <span><strong>Review daily:</strong> Even 10 minutes is better than cramming</span>
                            </li>
                            <li class="flex gap-2">
                                ${icon('checkCircle', 'w-4 h-4 sm:w-5 sm:h-5 text-green-600 flex-shrink-0 mt-0.5')}
                                <span><strong>Be honest:</strong> Rate based on actual recall, not recognition</span>
                            </li>
                            <li class="flex gap-2">
                                ${icon('checkCircle', 'w-4 h-4 sm:w-5 sm:h-5 text-green-600 flex-shrink-0 mt-0.5')}
                                <span><strong>Create good cards:</strong> Keep questions clear and concise</span>
                            </li>
                            <li class="flex gap-2">
                                ${icon('checkCircle', 'w-4 h-4 sm:w-5 sm:h-5 text-green-600 flex-shrink-0 mt-0.5')}
                                <span><strong>Trust the algorithm:</strong> Let SM-2 do its job</span>
                            </li>
                        </ul>
                    </section>
                </div>

                <div class="sticky bottom-0 bg-white border-t border-gray-200 p-4 sm:p-6 safe-area-bottom">
                    <button onclick="state.showGuide = false; render();" 
                        class="w-full bg-indigo-600 active:bg-indigo-700 text-white font-semibold py-3 sm:py-4 rounded-lg transition-colors touch-card">
                        Got it! Let's Start Learning
                    </button>
                </div>
            </div>
        </div>
    `;
}

function render() {
    const app = document.getElementById('app');
    
    let content = '';
    
    if (state.reviewMode) {
        content = renderReviewMode();
    } else {
        content = `
            <!-- Header -->
            <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10 safe-area-top">
                <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3 sm:py-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2 sm:gap-3">
                            <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-1.5 sm:p-2 rounded-lg sm:rounded-xl">
                                ${icon('brain', 'w-4 h-4 sm:w-6 sm:h-6 text-white')}
                            </div>
                            <div>
                                <h1 class="text-base sm:text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                                    Study Hub
                                </h1>
                                <p class="text-[10px] sm:text-xs text-gray-500 font-medium -mt-0.5">(𝐵𝑌 𝑅𝛯𝐷 𝐹𝐿𝛥𝐺)</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5 sm:gap-4">
                            <button onclick="state.showGuide = true; render();" 
                                class="flex items-center gap-1 text-indigo-600 active:text-indigo-700 font-medium transition-colors text-xs sm:text-sm touch-card p-1.5 sm:p-2">
                                ${icon('helpCircle', 'w-4 h-4 sm:w-5 sm:h-5')}
                            </button>
                            <button onclick="state.showGamification = true; render();" 
                                class="flex items-center gap-1 text-purple-600 active:text-purple-700 font-medium transition-colors text-xs sm:text-sm touch-card p-1.5 sm:p-2">
                                ${icon('award', 'w-4 h-4 sm:w-5 sm:h-5')}
                            </button>
                            <button onclick="if(confirm('Delete all data?')) resetAllData();" 
                                class="flex items-center text-red-600 active:text-red-700 font-medium transition-colors text-xs touch-card p-1.5 sm:p-2">
                                ${icon('trash', 'w-4 h-4 sm:w-5 sm:h-5')}
                            </button>
                            <div class="flex items-center gap-1 bg-orange-100 px-1.5 sm:px-3 py-1 sm:py-2 rounded-full">
                                ${icon('flame', 'w-3 h-3 sm:w-4 sm:h-4 text-orange-500')}
                                <span class="font-bold text-orange-700 text-xs">${state.user.streak}</span>
                            </div>
                            <div class="flex items-center gap-1 bg-yellow-100 px-1.5 sm:px-3 py-1 sm:py-2 rounded-full">
                                ${icon('trophy', 'w-3 h-3 sm:w-4 sm:h-4 text-yellow-600')}
                                <span class="font-bold text-yellow-700 text-xs">${state.user.xp}</span>
                            </div>
                            <div class="flex bg-indigo-100 px-1.5 sm:px-3 py-1 sm:py-2 rounded-full">
                                <span class="font-bold text-indigo-700 text-xs">L${state.user.level}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-8">
                ${state.currentView === 'dashboard' ? renderDashboard() : ''}
                ${state.currentView === 'createDeck' ? renderCreateDeck() : ''}
                ${state.currentView === 'analytics' ? renderAnalytics() : ''}
                ${state.currentView === 'deckDetails' ? renderDeckDetails() : ''}
            </div>
        `;
    }
    
    // Only show modals when NOT in review mode
    const modals = state.reviewMode ? '' : renderGuide() + renderGamification();
    app.innerHTML = content + modals;
}

// Initialize
initializeUserData();
loadData();
render();

// Service Worker registration (only if file exists)
if ('serviceWorker' in navigator && window.location.hostname !== 'www.claudeusercontent.com') {
    navigator.serviceWorker.register('/service-worker.js')
        .then(() => console.log('Service Worker registered'))
        .catch(err => console.log('Service Worker not available:', err.message));
}
</script>

</body>
</html>
